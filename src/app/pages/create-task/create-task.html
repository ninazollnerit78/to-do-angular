<h2 class="create_title">{{ isEditMode ? 'Edit Task' : 'Create new task' }}</h2>
<div class="task_informations">
    <div class="task_name_div">
        <p>Name</p>
        <input type="text" id="input_name" placeholder="Task Name" [(ngModel)]="task.name">
    </div>
    <div class="task_date">
        <p>Date</p>
       <div class="date_wrapper">
            <input matInput id="input_date" type="text" [value]="todayPlaceholder"  (click)="picker.open()" [placeholder]="todayPlaceholder" readonly [matDatepicker]="picker" (dateChange)="onDateChange($event)">
            <mat-datepicker #picker></mat-datepicker>
            <button class="calendar_btn" (click)="picker.open()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-days-icon lucide-calendar-days">
                    <path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/>
                    <path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/>
                    <path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>
                </svg>
            </button>
       </div>
    </div>
    <div class="task_time">
        <p>Starting Time</p>
        <div class="time_wrapper">
            <input type="text" id="input_time" (click)="timePicker.open()" [placeholder]="timePlaceholder" [(ngModel)]="task.time">
            <app-time-picker #timePicker (timeSelected)="onTimeSelected($event)"></app-time-picker>
            <button class="time_picker_btn" (click)="timePicker.open()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock3-icon lucide-clock-3">
                    <circle cx="12" cy="12" r="10"/><path d="M12 6v6h4"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="task_priority">
        <p>Priority</p>
        <div class="priority_btns">
            <button class="high" (click)="setPriority('high')" [class.active]="task.priority === 'high'">High</button>
            <button class="medium" (click)="setPriority('medium')" [class.active]="task.priority === 'medium'">Medium</button>
            <button class="low" (click)="setPriority('low')" [class.active]="task.priority === 'low'">Low</button>
        </div>
    </div>
    <div class="task_note">
        <p>Note</p>
        <textarea class="note_text" name="" [(ngModel)]="task.note" placeholder="Info about task..."></textarea>
    </div>
    <button class="create_task_btn" (click)="isEditMode ? updateTask() : createTask()" [disabled]="!isFormValid()">{{ isEditMode ? 'Save changes' : 'Create task' }}</button>
</div>
