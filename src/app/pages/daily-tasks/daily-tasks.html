<div class="daily_tasks">
    <div class="header">
        <h2 class="title">
            <span class="day_label">{{ dayLabel }}</span>
            <span class="full_date">{{ fullDate }}</span>
        </h2>
        <button class="add_task">+</button>
    </div>
    <div class="daily_list">
        <div class="task_item" *ngFor="let task of dailyTasks" (click)="routerNav.openTaskInfo(task.id)">
            <div class="task_title">
                <div class="title_container">
                    <span class="dot" [ngClass]="task.priority"></span>
                    <p class="task_name">{{ task.name }}</p>
                </div>
                <button class="delete_btn" (click)="deleteTask(task.id); $event.stopPropagation()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2-icon lucide-trash-2">
                        <path d="M10 11v6"/><path d="M14 11v6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                        <path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </button>
            </div>
            <div class="task_info">
                <p class="task_time">{{ task.time }}</p>
                <p class="task_note">{{ task.note }}</p>
            </div>
            <button class="task_info_btn">
                <svg width="22" height="22" viewBox="0 0 24 24">
                    <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="3"/>
                </svg>
            </button>
        </div>
    </div>
</div>
