<div class="week_card">
    <div class="card_title">
        <div class="today_title">
            <p>Today:</p>
            <h3 class="today_date">{{todayTitle}}</h3>
        </div>
        <div class="card_buttons">
            <button class="previous_week" (click)="previousWeek()">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
            </button>
            <button class="next_week" (click)="nextWeek()">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="week_container">
        <h3 class="month_title">{{ currentMonth.join(' ') }}</h3>
        <div class="week_days"  [ngClass]="animationClass" [class.expanded]="isExpanded">
            <div class="week_day" *ngFor="let day of isExpanded ? monthDays : weekDays" (click)="onDayClick(day)">
                <p class="day_name" *ngIf="!isExpanded || day.isCurrentMonth">{{day.name}}</p>
                <div class="day_date_wrapper" *ngIf="!isExpanded || day.isCurrentMonth">
                    <p class="day_date">{{day.date}}</p>
                    <div class="dots_wrapper">
                        <span class="dot" [ngClass]="day.tasks?.[i]?.priority ?? 'ghost'" *ngFor="let i of [0,1,2]"></span>
                    </div>
                </div>
            </div>
        </div>
        <button class="toggle_month" (click)="toggleMonth()" [class.expanded]="isExpanded">
            <svg width="26" height="30" viewBox="0 0 24 24" fill="none" *ngIf="!isExpanded">
                <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2"/>
                <path d="M6 3l6 6 6-6" stroke="currentColor" stroke-width="2"/>
            </svg>
            <svg width="26" height="30" viewBox="0 0 24 24" fill="none" *ngIf="isExpanded">
                <path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="2"/>
                <path d="M6 21l6-6 6 6" stroke="currentColor" stroke-width="2"/>
            </svg>
        </button>
    </div>
</div>
